name: ERP Release and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [ -n "$latest_tag" ]; then
            current_version="${latest_tag#v}"
            IFS=. read -r major minor patch <<< "$current_version"
            next_version="$major.$minor.$((patch + 1))"
          else
            next_version="$(node -p "require('./package.json').version")"
          fi

          next_tag="v$next_version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$next_tag" "$GITHUB_SHA"
          git push origin "$next_tag"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    outputs:
      version: ${{ needs.version.outputs.version }}
      image_registry: ${{ steps.image.outputs.image_registry }}
    steps:
      - uses: actions/checkout@v4
      - id: image
        shell: bash
        run: |
          echo "image_registry=${REGISTRY,,}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gitops/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.image_registry }}/klickit-erp-${{ matrix.target }}:${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: gitops/compose/docker-compose.production.yml,gitops/compose/docker-compose.gateway.yml,gitops/nginx/nginx.conf,gitops/postgres-init/001-create-erp-roles.sh
          target: ${{ secrets.DEPLOY_PATH }}
      - uses: appleboy/ssh-action@v1.2.1
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          IMAGE_REGISTRY: ${{ needs.publish.outputs.image_registry }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_VERSION,IMAGE_REGISTRY,DEPLOY_PATH,GHCR_USERNAME,GHCR_TOKEN
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            export KFE_VERSION="$RELEASE_VERSION"
            export ERP_IMAGE_REGISTRY="$IMAGE_REGISTRY"
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
            GATEWAY_NETWORK="$(awk -F= '$1 == "GATEWAY_NETWORK" { print substr($0, index($0, "=") + 1); exit }' .env)"
            COMPOSE_FILES=(-f gitops/compose/docker-compose.production.yml)
            if [ -n "$GATEWAY_NETWORK" ]; then
              if ! docker network inspect "$GATEWAY_NETWORK" >/dev/null 2>&1; then
                echo "Configured Kong Docker network '$GATEWAY_NETWORK' does not exist or is not accessible" >&2
                exit 1
              fi
              COMPOSE_FILES+=( -f gitops/compose/docker-compose.gateway.yml )
            fi
            for service_name in klickit-erp_postgres-prepare klickit-erp_rustfs-prepare klickit-erp_minio-init; do
              docker service rm "$service_name" >/dev/null 2>&1 || true
            done

            STACK_FILE="$(mktemp)"
            docker compose --env-file .env "${COMPOSE_FILES[@]}" config > "$STACK_FILE"
            sed -i '/^name: /d' "$STACK_FILE"
            # Compose renders published ports as quoted strings; Swarm requires integers.
            sed -i -E 's/(published: )"([0-9]+)"/\1\2/g' "$STACK_FILE"
            docker stack deploy --with-registry-auth --prune -c "$STACK_FILE" klickit-erp
            docker stack services klickit-erp

            wait_for_completion() {
              service_name="$1"
              echo "Waiting for Swarm service $service_name to complete..."
              attempt=0
              while [ "$attempt" -lt 60 ]; do
                state="$(docker service ps "$service_name" --format '{{.CurrentState}}' 2>/dev/null | head -n 1 || true)"
                case "$state" in
                  Complete*) return 0 ;;
                  Failed*|Rejected*|Shutdown*|"orchestration error"*)
                    docker service ps "$service_name" --no-trunc || true
                    docker service logs "$service_name" || true
                    return 1
                    ;;
                esac
                if [ "$((attempt % 6))" -eq 0 ]; then
                  echo "  $service_name state: ${state:-pending}"
                  docker service ps "$service_name" --no-trunc || true
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              echo "Timed out waiting for $service_name" >&2
              docker service ps "$service_name" --no-trunc || true
              docker service logs "$service_name" || true
              return 1
            }

            wait_for_completion klickit-erp_postgres-prepare
            wait_for_completion klickit-erp_minio-init

            MIGRATION_SERVICE="klickit-erp-migration"
            docker service rm "$MIGRATION_SERVICE" >/dev/null 2>&1 || true
            trap 'docker service rm "$MIGRATION_SERVICE" >/dev/null 2>&1 || true; rm -f "$STACK_FILE"' EXIT
            docker service create \
              --name "$MIGRATION_SERVICE" \
              --network klickit-erp_core \
              --env-file .env \
              --restart-condition none \
              "$ERP_IMAGE_REGISTRY/klickit-erp-api:$KFE_VERSION" \
              pnpm --dir packages/server migration:run >/dev/null

            wait_for_completion "$MIGRATION_SERVICE"
            docker service logs "$MIGRATION_SERVICE" || true
            docker image prune -af
