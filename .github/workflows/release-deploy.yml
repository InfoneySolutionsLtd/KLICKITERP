name: ERP Release and Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, worker, web]
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_registry: ${{ steps.image.outputs.image_registry }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          echo "version=$(git rev-parse --short=12 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"
      - id: image
        shell: bash
        run: |
          echo "image_registry=${REGISTRY,,}/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gitops/docker/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.image.outputs.image_registry }}/klickit-erp-${{ matrix.target }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: gitops/compose/docker-compose.production.yml,gitops/compose/docker-compose.gateway.yml,gitops/nginx/nginx.conf
          target: ${{ secrets.DEPLOY_PATH }}
      - uses: appleboy/ssh-action@v1.2.1
        env:
          RELEASE_VERSION: ${{ needs.publish.outputs.version }}
          IMAGE_REGISTRY: ${{ needs.publish.outputs.image_registry }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: RELEASE_VERSION,IMAGE_REGISTRY,DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            export KFE_VERSION="$RELEASE_VERSION"
            export ERP_IMAGE_REGISTRY="$IMAGE_REGISTRY"
            KONG_NETWORK="$(awk -F= '$1 == "KONG_NETWORK" { print substr($0, index($0, "=") + 1); exit }' .env)"
            COMPOSE_FILES=(-f gitops/compose/docker-compose.production.yml)
            if [ -n "$KONG_NETWORK" ]; then
              if ! docker network inspect "$KONG_NETWORK" >/dev/null 2>&1; then
                echo "Configured Kong Docker network '$KONG_NETWORK' does not exist or is not accessible" >&2
                exit 1
              fi
              COMPOSE_FILES+=( -f gitops/compose/docker-compose.gateway.yml )
            fi
            docker compose --env-file .env "${COMPOSE_FILES[@]}" pull
            docker compose --env-file .env "${COMPOSE_FILES[@]}" run --rm api pnpm --filter @klickit/server migration:run
            docker compose --env-file .env "${COMPOSE_FILES[@]}" up -d
            docker image prune -f
