server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  # Resolve Docker Swarm service names at request time. Static proxy_pass
  # resolution can cache a temporary DNS failure when web/api start after nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $web_upstream http://web:3002;
  set $api_upstream http://api:3000;

  location / {
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # These are Next.js route handlers, not backend API endpoints.
  location ^~ /api/auth/ {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/theme {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # The notification bell's live-update stream (Server-Sent Events): one long-lived response per open tab that must not be
  # buffered or cut off. The API sends a heartbeat every 25 s and ends each stream after about 14 minutes (the client then
  # reconnects with a fresh token), so a 15-minute read timeout never fires on a healthy stream. Without this block the
  # generic /api/ location would buffer it and the bell would fall back to its 60-second poll.
  location = /api/v1/notifications/stream {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_read_timeout 900s;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass $api_upstream/health;
  }

  location = /health/ready {
    proxy_pass $api_upstream/health/ready;
  }
}
