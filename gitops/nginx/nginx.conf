server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  # Resolve Docker Swarm service names at request time. Static proxy_pass
  # resolution can cache a temporary DNS failure when web/api start after nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;
  set $web_upstream http://web:3002;
  set $api_upstream http://api:3000;

  location / {
    proxy_pass $web_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # These are Next.js route handlers, not backend API endpoints.
  location ^~ /api/auth/ {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/theme {
    proxy_pass $web_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  location = /health {
    proxy_pass $api_upstream/health;
  }

  location = /health/ready {
    proxy_pass $api_upstream/health/ready;
  }
}
