name: klickit-erp

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]

  web:
    image: "${ERP_IMAGE_REGISTRY}/klickit-erp-web:${KFE_VERSION}"
    restart: unless-stopped
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [edge]

  api:
    image: "${ERP_IMAGE_REGISTRY}/klickit-erp-api:${KFE_VERSION}"
    restart: unless-stopped
    env_file: ["${ERP_ENV_FILE:-../../.env}"]
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [edge, core]

  worker:
    image: "${ERP_IMAGE_REGISTRY}/klickit-erp-worker:${KFE_VERSION}"
    restart: unless-stopped
    env_file: ["${ERP_ENV_FILE:-../../.env}"]
    expose: ["3001"]
    networks: [core]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ["${ERP_ENV_FILE:-../../.env}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres-init/001-create-erp-roles.sh:/docker-entrypoint-initdb.d/001-create-erp-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [core]

  postgres-prepare:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: postgres
      PGPORT: 5432
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_DB: ${DB_NAME}
      PGPASSWORD: ${POSTGRES_SUPERPASSWORD}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
    volumes:
      - ../postgres-init/001-create-erp-roles.sh:/usr/local/bin/001-create-erp-roles.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        attempts=0;
        until pg_isready -h "$${PGHOST}" -p "$${PGPORT}" -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"; do
          attempts=$$((attempts + 1));
          if [ "$${attempts}" -ge 60 ]; then echo 'PostgreSQL did not become ready within 120 seconds' >&2; exit 1; fi;
          sleep 2;
        done;
        /usr/local/bin/001-create-erp-roles.sh
    deploy:
      restart_policy:
        condition: none
    networks: [core]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [core]

  minio:
    image: rustfs/rustfs:1.0.0
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [core]

  rustfs-prepare:
    image: alpine:3.22
    restart: "no"
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    deploy:
      restart_policy:
        condition: none
    volumes:
      - miniodata:/data
    networks: [core]

  minio-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.37.0
    restart: "no"
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      MINIO_BUCKET_DEFAULT: ${MINIO_BUCKET_DEFAULT:-klickit-erp-files}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        attempts=0;
        until aws --endpoint-url http://minio:9000 s3api list-buckets >/dev/null 2>&1; do
          attempts=$$((attempts + 1));
          if [ "$${attempts}" -ge 90 ]; then echo 'RustFS S3 API did not become ready within 180 seconds' >&2; exit 1; fi;
          sleep 2;
        done;
        for bucket in klickit-erp-files "$${MINIO_BUCKET_DEFAULT}"; do
          aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$${bucket}" >/dev/null 2>&1 ||
          aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$${bucket}";
        done
    deploy:
      restart_policy:
        condition: none
    networks: [core]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  edge:
  core:
    internal: true
