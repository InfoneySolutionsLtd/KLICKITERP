name: klickit-erp-dev

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge]

  web:
    image: "${ERP_IMAGE_REGISTRY}/klickit-erp-web:${KFE_VERSION}"
    restart: unless-stopped
    expose: ["3002"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [edge]

  api:
    image: "${ERP_IMAGE_REGISTRY}/klickit-erp-api:${KFE_VERSION}"
    restart: unless-stopped
    env_file: ["${ERP_ENV_FILE:-../../.env}"]
    expose: ["3000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks: [edge, core]

  worker:
    image: "${ERP_IMAGE_REGISTRY}/klickit-erp-worker:${KFE_VERSION}"
    restart: unless-stopped
    env_file: ["${ERP_ENV_FILE:-../../.env}"]
    expose: ["3001"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [core]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ["${ERP_ENV_FILE:-../../.env}"]
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [core]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [core]

volumes:
  pgdata:
  redisdata:

networks:
  edge:
  core:
    internal: true
